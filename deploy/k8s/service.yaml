apiVersion: v1
kind: Service
metadata:
  name: models-catalog
spec:
  selector: {app: models-catalog}
  ports:
    - name: http
      port: 80
      targetPort: 8000
# Ingress/Route bu manifestte yok: kümenizin standardına göre ekleyin ve host adını
# configmap.yaml içindeki CATALOG_ALLOWED_HOSTS ile aynı yapın.
