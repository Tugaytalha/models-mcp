apiVersion: batch/v1
kind: Job
metadata:
  name: models-catalog-migrate
  annotations:
    # ArgoCD: her sync'ten önce, uygulama podları güncellenmeden çalışır (replica yarışı olmaz).
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: models-catalog
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - secretRef: {name: models-catalog-db}
