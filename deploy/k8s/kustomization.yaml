apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: models-mcp
resources:
  - configmap.yaml
  - deployment.yaml
  - service.yaml
# secret.example.yaml bilerek dahil değil: gerçek secret'ı kendi yönteminizle (Vault/SealedSecrets) oluşturun.
images:
  - name: models-catalog
    newName: registry.example.local/ml/models-catalog   # kendi registry'nizle değiştirin
    newTag: "0.1.0"
