<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Model Kataloğu{% endblock %}</title>
<style>
:root {
  --bg: #f7f7f5; --surface: #ffffff; --text: #1f2328; --muted: #656d76; --border: #d8dce0;
  --accent: #1f6feb; --code-bg: #f1f3f5; --ok: #1a7f37; --warn: #9a6700; --bad: #cf222e;
  --ok-bg: #dafbe1; --warn-bg: #fff8c5; --bad-bg: #ffebe9; --neutral-bg: #eaeef2;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0d1117; --surface: #161b22; --text: #e6edf3; --muted: #8b949e; --border: #30363d;
    --accent: #58a6ff; --code-bg: #0d1117; --ok: #3fb950; --warn: #d29922; --bad: #f85149;
    --ok-bg: #12261e; --warn-bg: #2d2a12; --bad-bg: #321a1d; --neutral-bg: #21262d;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
a { color: var(--accent); text-decoration: none; } a:hover { text-decoration: underline; }
header.top { background: var(--surface); border-bottom: 1px solid var(--border); }
.wrap { max-width: 1280px; margin: 0 auto; padding: 0 16px; }
header.top .wrap { display: flex; align-items: center; gap: 16px; height: 52px; }
header.top strong { font-size: 16px; }
header.top .muted { margin-left: auto; }
main.wrap { padding-top: 20px; padding-bottom: 48px; }
.muted { color: var(--muted); font-size: 13px; }
h1 { font-size: 22px; margin: 0 0 4px; } h2 { font-size: 16px; margin: 0 0 12px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px; }
.grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); margin: 16px 0; }
form.filters { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0; }
input, select { background: var(--surface); color: var(--text); border: 1px solid var(--border);
  border-radius: 6px; padding: 7px 10px; font: inherit; }
input[type=search] { flex: 1 1 240px; }
button { background: var(--accent); color: #fff; border: 0; border-radius: 6px; padding: 7px 14px; font: inherit; cursor: pointer; }
button.ghost { background: transparent; color: var(--accent); border: 1px solid var(--border); padding: 3px 9px; font-size: 12px; }
.tablewrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .03em; }
tbody tr:hover { background: var(--neutral-bg); } tr:last-child td { border-bottom: 0; }
td.wrap-ok { white-space: normal; }
.badge { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px; background: var(--neutral-bg); }
.badge.ok { background: var(--ok-bg); color: var(--ok); } .badge.warn { background: var(--warn-bg); color: var(--warn); }
.badge.bad { background: var(--bad-bg); color: var(--bad); }
.badge.env-prod { background: var(--bad-bg); color: var(--bad); }
.badge.env-uat { background: var(--warn-bg); color: var(--warn); }
.badge.env-dev { background: var(--ok-bg); color: var(--ok); }
dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin: 0; }
dt { color: var(--muted); } dd { margin: 0; overflow-wrap: anywhere; }
code, pre { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 13px; }
pre { background: var(--code-bg); border: 1px solid var(--border); border-radius: 6px; padding: 12px; margin: 0;
  overflow-x: auto; white-space: pre; }
.codeblock { position: relative; margin: 8px 0 14px; }
.codeblock button { position: absolute; top: 6px; right: 6px; }
.codeblock .label { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 14px; flex-wrap: wrap; }
.tab { background: none; color: var(--muted); border-radius: 6px 6px 0 0; padding: 8px 14px; border: 0; }
.tab[aria-selected=true] { color: var(--text); border-bottom: 2px solid var(--accent); font-weight: 600; }
.panel[hidden] { display: none; }
.empty { padding: 32px; text-align: center; color: var(--muted); }
@media (max-width: 600px) { header.top .muted { display: none; } }
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a href="/"><strong>Model &amp; Servis Kataloğu</strong></a>
  <span class="muted">MCP: <code>/mcp</code> &middot; REST: <a href="/docs">/docs</a></span>
</div></header>
<main class="wrap">{% block content %}{% endblock %}</main>
<script>
document.addEventListener('click', function (e) {
  var b = e.target.closest('[data-copy]');
  if (b) {
    var text = b.closest('.codeblock').querySelector('pre').innerText;
    var done = function () { var o = b.textContent; b.textContent = 'Kopyalandı'; setTimeout(function () { b.textContent = o; }, 1200); };
    if (navigator.clipboard && window.isSecureContext) { navigator.clipboard.writeText(text).then(done); }
    else { var t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select();
           try { document.execCommand('copy'); done(); } catch (_) {} document.body.removeChild(t); }
    return;
  }
  var tab = e.target.closest('.tab');
  if (tab) {
    var group = tab.closest('[data-tabs]');
    group.querySelectorAll(':scope > .tabs > .tab').forEach(function (t) { t.setAttribute('aria-selected', t === tab); });
    group.querySelectorAll(':scope > .panel').forEach(function (p) { p.hidden = p.id !== tab.dataset.target; });
  }
});
</script>
</body>
</html>
